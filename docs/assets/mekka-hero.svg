    <path d="M378 349L390 361L378 373" fill="none" stroke="#d7ff3f" stroke-width="4"/>
    <rect x="410" y="318" width="210" height="86" fill="#111" stroke="#f4f4f4" stroke-width="2"/>
    <text x="436" y="354" fill="#f4f4f4">MCP + GATEWAY</text>
    <text x="436" y="380" fill="#929292">SCOPES / LIMITS</text>
