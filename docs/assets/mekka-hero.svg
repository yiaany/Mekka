  <text x="92" y="462" fill="#929292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">DENY BY DEFAULT // TENANT TUPLE EVERYWHERE // NO RAW DATABASE CREDENTIALS FOR AGENTS</text>
