<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
  <title id="title">Mekka product architecture</title>
  <desc id="desc">A brutalist black and green diagram showing Studio, Agent Access, Gateway, and SQLite.</desc>
  <rect width="1440" height="540" fill="#090909"/>
  <path d="M0 90H1440M0 180H1440M0 270H1440M0 360H1440M0 450H1440M120 0V540M240 0V540M360 0V540M480 0V540M600 0V540M720 0V540M840 0V540M960 0V540M1080 0V540M1200 0V540M1320 0V540" stroke="#202020" stroke-width="1"/>
  <rect x="52" y="48" width="1336" height="444" fill="none" stroke="#d7ff3f" stroke-width="3"/>
  <text x="92" y="135" fill="#d7ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="72" font-weight="800" letter-spacing="-4">MEKKA</text>
  <text x="92" y="188" fill="#f4f4f4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">BACKEND INFRASTRUCTURE THAT FITS IN YOUR HEAD.</text>
  <text x="92" y="226" fill="#929292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">SQLITE DATA PLANE / EMBEDDED STUDIO / SCOPED AGENT ACCESS</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">
    <rect x="92" y="318" width="210" height="86" fill="#d7ff3f"/>
    <text x="118" y="354" fill="#090909">BROWSER + AGENT</text>
